<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Medo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
a
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="icon">🔍</div>
    <div class="icon">🏠</div>
    <div class="icon">📺</div>
    <div class="icon">🎬</div>
  </aside>

  <!-- Container Principal -->
  <div class="main-container">
    
    <header class="header">
      <h1 class="brand-title">Portal do Medo</h1>
      <div class="user-profile">👤</div>
    </header>

    <main class="content-section">
      <h2 class="section-title">Filmes em Alta</h2>
      
      <div class="carousel-container">
        <button class="carousel-btn" id="prevBtn">&lt;</button>
        
        <div class="cards-wrapper" id="carouselWrapper">
          <!-- Card 1 -->
          <div class="movie-card">
            <div class="poster-container">
              <img src="panico.webp" alt="Pânico 7">
            </div>
            <div class="card-info">
              <h3 class="movie-title">Pânico 7</h3>
              <p class="movie-description">Ghostface volta a caçar Sidney Prescott em um novo capítulo aterrorizante.</p>
            </div>
          </div>

          <!-- Card 2 -->
          <div class="movie-card">
            <div class="poster-container">
              <img src="obsessão.jpg" alt="Obsessão">
            </div>
            <div class="card-info">
              <h3 class="movie-title">Obsessão</h3>
              <p class="movie-description">Desejo mágico vira um pesadelo violento de terror psicológico.</p>
            </div>
          </div>

          <!-- Card 3 -->
          <div class="movie-card">
            <div class="poster-container">
              <img src="https://via.placeholder.com/240x340" alt="Labirinto Amarelo">
            </div>
            <div class="card-info">
              <h3 class="movie-title">Salas Amarelas</h3>
              <p class="movie-description">Cineasta fica preso em um labirinto infinito de salas amarelas sem saída.</p>
            </div>
          </div>
        </div>

        <button class="carousel-btn" id="nextBtn">&gt;</button>
      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
